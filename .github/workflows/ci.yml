name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.16.10 pytest pytest-cov
          python -m pip install -r requirements.txt
      - name: Lint (hard gate)
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Tests
        run: python -m pytest -q -W ignore::UserWarning --cov=ssmforge --cov-report=term
      - name: Demo smoke (deterministic, bit-for-bit)
        run: python examples/run_demo.py
      - name: Secret scan
        if: matrix.os == 'ubuntu-latest'
        run: |
          ! git grep -nEi "(sk-[a-z0-9]|api[_-]?key|secret|password|token)" -- '*.py' '*.md' '*.yml'
