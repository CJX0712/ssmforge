[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssmforge"
version = "0.1.0"
description = "SSMForge — Structured State Space Models (S4/S4D) research toolkit with a multi-rate S4DFuse flagship."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "晨星 (CJX0712)" }]
keywords = ["state-space-models", "s4", "s4d", "hippo", "long-range", "ssm", "pytorch-free"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff==0.16.10"]
full = ["scikit-learn>=1.2"]

[project.scripts]
ssmforge = "ssmforge.cli:main"

[tool.setuptools.packages.find]
include = ["ssmforge*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q -W ignore::UserWarning"
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
